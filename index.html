<script>
    const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive";
    let tokenClient;
    let accessToken = null;

    function handleCredentialResponse(response) {
        console.log("Google認証に成功しました。");

        const signinArea =
            document.querySelector(".g_id_signin");

        if (signinArea) {
            signinArea.style.display = "none";
        }

        alert("Google認証に成功しました。");

        requestDriveToken();
    }

    window.addEventListener("load", () => {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: "305148912249-6k7h28c4spkvavpli1omi5qpcl0b1u65.apps.googleusercontent.com",
            scope: DRIVE_SCOPE,
            callback: (response) => {
                console.log("Access Token received:", response);
                accessToken = response.access_token;
            }
        });

        console.log("OAuth token client initialized.");
    });

    function requestDriveToken() {
        tokenClient.requestAccessToken();
    }
</script>

<script>
    const DRIVE_FOLDER_ID =
        "1Wd47BWeQseTkNvpqLFKmNbQ-62s7HpKe";

    const DRIVE_FILE_ID_KEY =
        "WaterCheck_DriveFileId_V1";

    async function uploadWorkDataToDrive() {
        if (
            typeof accessToken === "undefined" ||
            !accessToken
        ) {
            return;
        }

        const backupData = {
            app: {
                name: "WaterCheck",
                version: "1.0.08",
                exportedAt: new Date().toISOString()
            },
            workData: workData,
            evidence: []
        };

        const jsonText =
            JSON.stringify(backupData, null, 2);

        let savedFileId =
            localStorage.getItem(
                DRIVE_FILE_ID_KEY
            );

        try {

            /*
            ----------------------------------------
            ファイルIDがない場合
            Google Drive内から既存の
            WaterCheck.jsonを検索
            ----------------------------------------
            */
            if (!savedFileId) {

                const query =
                    "'" +
                    DRIVE_FOLDER_ID +
                    "' in parents and " +
                    "name = 'WaterCheck.json' and " +
                    "trashed = false";

                const searchResponse =
                    await fetch(
                        "https://www.googleapis.com/drive/v3/files" +
                        "?q=" +
                        encodeURIComponent(query) +
                        "&fields=files(id,name)",
                        {
                            method: "GET",
                            headers: {
                                Authorization:
                                    "Bearer " + accessToken
                            }
                        }
                    );

                if (!searchResponse.ok) {
                    console.error(
                        "Google Driveファイル検索エラー:",
                        searchResponse.status,
                        await searchResponse.text()
                    );
                    return;
                }

                const searchData =
                    await searchResponse.json();

                if (
                    searchData.files &&
                    searchData.files.length > 0
                ) {
                    savedFileId =
                        searchData.files[0].id;

                    localStorage.setItem(
                        DRIVE_FILE_ID_KEY,
                        savedFileId
                    );

                    console.log(
                        "既存のGoogle Driveファイルを使用します:",
                        savedFileId
                    );
                }
            }

            let response;

            /*
            ----------------------------------------
            既存ファイルがある場合
            ----------------------------------------
            */
            if (savedFileId) {

                response = await fetch(
                    "https://www.googleapis.com/upload/drive/v3/files/" +
                    savedFileId +
                    "?uploadType=media",
                    {
                        method: "PATCH",
                        headers: {
                            Authorization:
                                "Bearer " + accessToken,
                            "Content-Type":
                                "application/json"
                        },
                        body: jsonText
                    }
                );

            /*
            ----------------------------------------
            既存ファイルがない場合
            新しいファイルを作成
            ----------------------------------------
            */
            } else {

                const metadata = {
                    name: "WaterCheck.json",
                    parents: [
                        DRIVE_FOLDER_ID
                    ],
                    mimeType: "application/json"
                };

                const boundary =
                    "-------WaterCheckBoundary";

                const body =
                    "--" + boundary + "\r\n" +
                    "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
                    JSON.stringify(metadata) +
                    "\r\n" +
                    "--" + boundary + "\r\n" +
                    "Content-Type: application/json\r\n\r\n" +
                    jsonText +
                    "\r\n" +
                    "--" + boundary + "--";

                response = await fetch(
                    "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
                    {
                        method: "POST",
                        headers: {
                            Authorization:
                                "Bearer " + accessToken,
                            "Content-Type":
                                "multipart/related; boundary=" +
                                boundary
                        },
                        body: body
                    }
                );
            }

            /*
            ----------------------------------------
            保存結果確認
            ----------------------------------------
            */
            if (!response.ok) {
                console.error(
                    "Google Drive保存エラー:",
                    response.status,
                    await response.text()
                );
                return;
            }

            const data =
                await response.json();

            /*
            ----------------------------------------
            新規作成した場合は
            ファイルIDを保存
            ----------------------------------------
            */
            if (!savedFileId && data.id) {

                localStorage.setItem(
                    DRIVE_FILE_ID_KEY,
                    data.id
                );

                console.log(
                    "Google Driveファイルを作成しました:",
                    data.id
                );

            } else {

                console.log(
                    "Google Driveを更新しました。"
                );
            }

        } catch (error) {

            console.error(
                "Google Drive保存中にエラーが発生しました:",
                error
            );
        }
    }
</script>
