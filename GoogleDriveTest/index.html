<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <h1>Google Drive API Test</h1>

    <p>WaterCheck Ver2 Google Drive接続テスト</p>
    <div id="g_id_onload"
        data-client_id="305148912249-6k7h28c4spkvavpli1omi5qpcl0b1u65.apps.googleusercontent.com"
        data-callback="handleCredentialResponse">
    </div>

    <div class="g_id_signin"
        data-type="standard">
    </div>

    <button onclick="requestDriveToken()">Google Driveアクセス許可を取得</button>
    <button onclick="testDriveApi()">Google Drive APIテスト</button>

    <script>
        function handleCredentialResponse(response) {
            document.body.insertAdjacentHTML(
                "beforeend",
                "<p>Google認証に成功しました。</p>"
            );

            console.log("Credential received:", response);
        }
    </script>

    <script>
        const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive";
        let tokenClient;
        let accessToken = null;

        window.addEventListener("load", () => {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: "305148912249-6k7h28c4spkvavpli1omi5qpcl0b1u65.apps.googleusercontent.com",
                scope: DRIVE_SCOPE,
                callback: (response) => {
                    console.log("Access Token received:", response);
                    accessToken = response.access_token;
                }
            });

            console.log("OAuth token client initialized.");
        });

        function requestDriveToken() {
            tokenClient.requestAccessToken();
        }

        async function testDriveApi() {
            console.log("Drive file create test started.");

            const folderId = "1Wd47BWeQseTkNvpqLFKmNbQ-62s7HpKe";

            const metadata = {
                name: "WaterCheck_test_data.txt",
                mimeType: "text/plain",
                parents: [folderId]
            };

            const content = "WaterCheck Google Drive test";

            const form = new FormData();

            form.append(
                "metadata",
                new Blob(
                    [JSON.stringify(metadata)],
                    { type: "application/json" }
                )
            );

            form.append(
                "file",
                new Blob(
                    [content],
                    { type: "text/plain" }
                )
            );

            const response = await fetch(
                "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
                {
                    method: "POST",
                    headers: {
                        Authorization: "Bearer " + accessToken
                    },
                    body: form
                }
            );

            const data = await response.json();

            console.log("Created file:", data);
        }
    </script>
</body>
</html>
