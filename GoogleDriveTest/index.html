<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <h1>Google Drive API Test</h1>

    <p>WaterCheck Ver2 Google Drive接続テスト</p>
    <div id="g_id_onload"
        data-client_id="305148912249-6k7h28c4spkvavpli1omi5qpcl0b1u65.apps.googleusercontent.com"
        data-callback="handleCredentialResponse">
    </div>

    <div class="g_id_signin"
        data-type="standard">
    </div>

    <button onclick="requestDriveToken()">Google Driveアクセス許可を取得</button>
    <button onclick="testDriveApi()">Google Drive APIテスト</button>

    <script>
        function handleCredentialResponse(response) {
            document.body.insertAdjacentHTML(
                "beforeend",
                "<p>Google認証に成功しました。</p>"
            );

            console.log("Credential received:", response);
        }
    </script>

    <script>
        const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive";
        let tokenClient;
        let accessToken = null;

        window.addEventListener("load", () => {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: "305148912249-6k7h28c4spkvavpli1omi5qpcl0b1u65.apps.googleusercontent.com",
                scope: DRIVE_SCOPE,
                callback: (response) => {
                    console.log("Access Token received:", response);
                    accessToken = response.access_token;
                }
            });

            console.log("OAuth token client initialized.");
        });

        function requestDriveToken() {
            tokenClient.requestAccessToken();
        }

        async function testDriveApi() {
            console.log("JSON file read test started.");

            const fileId = "1Vmp4_a6MkjvfMQNup2bP4jlbpbkN4GTN";

            const response = await fetch(
                "https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media",
                {
                    headers: {
                        Authorization: "Bearer " + accessToken
                    }
                }
            );

            const text = await response.text();

            console.log("JSON file raw contents:", text);

            const data = JSON.parse(text);

            console.log("Parsed JSON data:", data);
        }
    </script>
</body>
</html>
